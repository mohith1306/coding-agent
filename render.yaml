services:
  - type: web
    name: coding-agent
    runtime: docker
    plan: free
    dockerfilePath: ./web/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CODING_AGENT_INTENT_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_URL
        fromDatabase:
          name: coding-agent-db
          property: connectionString

databases:
  - name: coding-agent-db
    plan: free
    databaseName: coding_agent
