[pytest]
testpaths = tests
norecursedirs =
    web/workspaces
    web/frontend/node_modules
    .git
    __pycache__

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests requiring external services
    graph: marks tests specific to the LangGraph runtime
    legacy: marks tests specific to the legacy CodingAgent runtime

addopts =
    -ra
    --strict-markers
    --tb=short

[coverage:run]
source = coding_agent
omit =
    tests/*
    web/*
    .coding-agent/*
    */node_modules/*

[coverage:report]
show_missing = true
skip_covered = true
fail_under = 0
exclude_lines =
    pragma: no cover
    def __repr__
    if TYPE_CHECKING:
    raise NotImplementedError
